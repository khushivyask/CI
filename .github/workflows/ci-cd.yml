name: CI/CD Pipeline — Angular + Spring Boot + Qodana

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:
  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 1 — Build & Test: user-service
  # ══════════════════════════════════════════════════════════════════════════════
  test-user-service:
    name: Test — user-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & run tests with coverage
        run: mvn verify -B

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: user-service-coverage
          path: services/user-service/target/site/jacoco/

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 2 — Build & Test: product-service
  # ══════════════════════════════════════════════════════════════════════════════
  test-product-service:
    name: Test — product-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/product-service

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build & run tests with coverage
        run: mvn verify -B

      - name: Upload JaCoCo coverage report
        uses: actions/upload-artifact@v4
        with:
          name: product-service-coverage
          path: services/product-service/target/site/jacoco/

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 3 — Lint & Test: Angular frontend
  # ══════════════════════════════════════════════════════════════════════════════
  test-frontend:
    name: Test — Angular frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci


      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 4 — Qodana: user-service
  # ══════════════════════════════════════════════════════════════════════════════
  qodana-user-service:
    name: Qodana — user-service
    runs-on: ubuntu-latest
    needs: [test-user-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate diff analysis

      - name: Set up Java (needed so Maven can build before Qodana)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build (generate JaCoCo report for Qodana coverage)
        working-directory: services/user-service
        run: mvn verify -B -DskipTests

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: user-service-coverage
          path: services/user-service/target/site/jacoco/

      - name: Run Qodana analysis
        uses: JetBrains/qodana-action@v2024.1
        with:
          project-dir: services/user-service
          results-dir: ${{ runner.temp }}/qodana-user
          upload-result: true
          # Set QODANA_TOKEN in repo secrets for Qodana Cloud upload
          # If no cloud account, remove the token line below
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_USER }}

      - name: Upload Qodana report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-user-service-report
          path: ${{ runner.temp }}/qodana-user/

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 5 — Qodana: product-service
  # ══════════════════════════════════════════════════════════════════════════════
  qodana-product-service:
    name: Qodana — product-service
    runs-on: ubuntu-latest
    needs: [test-product-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build (generate JaCoCo report)
        working-directory: services/product-service
        run: mvn verify -B -DskipTests

      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: product-service-coverage
          path: services/product-service/target/site/jacoco/

      - name: Run Qodana analysis
        uses: JetBrains/qodana-action@v2024.1
        with:
          project-dir: services/product-service
          results-dir: ${{ runner.temp }}/qodana-product
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_PRODUCT }}

      - name: Upload Qodana report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-product-service-report
          path: ${{ runner.temp }}/qodana-product/

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 6 — Docker Build & Push (only on push to main)
  # ══════════════════════════════════════════════════════════════════════════════
  docker-build-push:
    name: Docker build & push
    runs-on: ubuntu-latest
    needs:
      - qodana-user-service
      - qodana-product-service
      - test-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: user-service
            context: services/user-service
          - name: product-service
            context: services/product-service
          - name: api-gateway
            context: services/api-gateway
          - name: frontend
            context: frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 7 — Trivy Security Scan on built images
  # ══════════════════════════════════════════════════════════════════════════════
  trivy-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        service: [user-service, product-service, api-gateway, frontend]

    steps:
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 8 — Deploy to Staging
  # ══════════════════════════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy — staging
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: http://staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/ecommerce-staging
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GITHUB_REPOSITORY=${{ github.repository }}
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml pull
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d --remove-orphans
            docker system prune -f

      - name: Smoke test staging health endpoints
        run: |
          echo "Waiting 30s for services to start..."
          sleep 30
          curl --fail http://staging.example.com:8081/api/users/health
          curl --fail http://staging.example.com:8082/api/products/health
          curl --fail http://staging.example.com:8080/actuator/health
          curl --fail http://staging.example.com/
          echo "All health checks passed!"

  # ══════════════════════════════════════════════════════════════════════════════
  # JOB 9 — Deploy to Production (requires manual approval via environment rule)
  # ══════════════════════════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy — production
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production # <-- set "Required reviewers" on this env in GitHub settings
      url: http://production.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        run: echo "IMAGE_TAG=sha-$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Rolling deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/ecommerce-production
            export IMAGE_TAG=${{ env.IMAGE_TAG }}
            export GITHUB_REPOSITORY=${{ github.repository }}

            # Pull new images
            docker-compose -f docker-compose.yml -f docker-compose.staging.yml pull

            # Rolling update — one service at a time
            for svc in user-service product-service api-gateway frontend; do
              echo "Updating $svc..."
              docker-compose -f docker-compose.yml -f docker-compose.staging.yml up -d --no-deps $svc
              sleep 10
            done

            docker system prune -f
            echo "Production deployment complete!"

      - name: Verify production health
        run: |
          sleep 30
          curl --fail http://production.example.com:8081/api/users/health
          curl --fail http://production.example.com:8082/api/products/health
          curl --fail http://production.example.com/
          echo "Production health checks passed!"
