name: CI/CD Pipeline — Angular + Spring Boot + Qodana

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

jobs:

  test-user-service:
    name: Test - user-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/user-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run tests with coverage
        run: mvn verify -B

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-service-coverage
          path: services/user-service/target/site/jacoco/
          if-no-files-found: warn

  test-product-service:
    name: Test - product-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/product-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and run tests with coverage
        run: mvn verify -B

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-service-coverage
          path: services/product-service/target/site/jacoco/
          if-no-files-found: warn

  test-frontend:
    name: Test - Angular frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test
        env:
          CHROME_BIN: google-chrome

      - name: Build production bundle
        run: npm run build

  qodana-user-service:
    name: Qodana - user-service
    runs-on: ubuntu-latest
    needs: [test-user-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and generate coverage report
        working-directory: services/user-service
        run: mvn verify -B

      - name: Run Qodana analysis
        uses: JetBrains/qodana-action@v2024.1
        continue-on-error: true
        with:
          project-dir: services/user-service
          results-dir: ${{ runner.temp }}/qodana-user
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_USER }}

      - name: Upload Qodana report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-user-service-report
          path: ${{ runner.temp }}/qodana-user/
          if-no-files-found: warn

  qodana-product-service:
    name: Qodana - product-service
    runs-on: ubuntu-latest
    needs: [test-product-service]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build and generate coverage report
        working-directory: services/product-service
        run: mvn verify -B

      - name: Run Qodana analysis
        uses: JetBrains/qodana-action@v2024.1
        continue-on-error: true
        with:
          project-dir: services/product-service
          results-dir: ${{ runner.temp }}/qodana-product
          upload-result: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN_PRODUCT }}

      - name: Upload Qodana report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qodana-product-service-report
          path: ${{ runner.temp }}/qodana-product/
          if-no-files-found: warn

  docker-build-push:
    name: Docker build and push
    runs-on: ubuntu-latest
    needs:
      - qodana-user-service
      - qodana-product-service
      - test-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - name: user-service
            context: services/user-service
          - name: product-service
            context: services/product-service
          - name: api-gateway
            context: services/api-gateway
          - name: frontend
            context: frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trivy-scan:
    name: Trivy CVE scan
    runs-on: ubuntu-latest
    needs: [docker-build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    strategy:
      matrix:
        service: [user-service, product-service, api-gateway, frontend]
    steps:
      - name: Set lowercase image prefix
        id: vars
        run: |
          echo "image_prefix=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.vars.outputs.image_prefix }}/${{ matrix.service }}:latest
          format: table
          exit-code: 0
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  deploy-staging:
    name: Deploy - staging (simulated)
    runs-on: ubuntu-latest
    needs: [trivy-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest images
        run: |
          IMAGE_PREFIX=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          docker pull ghcr.io/${IMAGE_PREFIX}/user-service:latest
          docker pull ghcr.io/${IMAGE_PREFIX}/product-service:latest
          docker pull ghcr.io/${IMAGE_PREFIX}/api-gateway:latest
          docker pull ghcr.io/${IMAGE_PREFIX}/frontend:latest
          echo "All images pulled successfully"

      - name: Verify images exist
        run: |
          docker images
          echo "Images verified - ready to deploy"

      - name: Simulate deployment
        run: |
          echo "Deploying to staging..."
          echo "user-service deployed"
          echo "product-service deployed"
          echo "api-gateway deployed"
          echo "frontend deployed"
          echo "Staging deployment complete!"

  deploy-production:
    name: Deploy - production (simulated)
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate production deployment
        run: |
          echo "Deploying to production..."
          echo "Rolling update - user-service"
          echo "Rolling update - product-service"
          echo "Rolling update - api-gateway"
          echo "Rolling update - frontend"
          echo "Production deployment complete!"

      - name: Health check simulation
        run: |
          echo "user-service - healthy"
          echo "product-service - healthy"
          echo "api-gateway - healthy"
          echo "frontend - healthy"
          echo "All health checks passed!"